name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (vet + unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: map
          POSTGRES_PASSWORD: map
          POSTGRES_DB: mapserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U map -d mapserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Create test database
        env:
          PGPASSWORD: map
        run: psql -h localhost -U map -d mapserver -c 'CREATE DATABASE mapserver_test OWNER map;'

      - name: go vet
        run: cd backend && go vet ./...

      - name: go test (unit + integration)
        env:
          TEST_DATABASE_URL: postgres://map:map@localhost:5432/mapserver_test?sslmode=disable
        run: cd backend && go test ./... -count=1

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd frontend && pnpm typecheck

      - name: Test
        run: cd frontend && pnpm test

      - name: Build
        run: cd frontend && pnpm build
