services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mapserver-db
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-map}
      POSTGRES_DB: mapserver
    ports:
      - "5432:5432"
    volumes:
      - mapserver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d mapserver"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: mapserver-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8420"
      DATABASE_URL: postgres://map:${POSTGRES_PASSWORD:-map}@db:5432/mapserver?sslmode=disable
      # 生产环境务必设置：JWT_SECRET、ADMIN_PASSWORD
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_ENV: ${APP_ENV:-production}
      TILE_CACHE_DIR: /data/tile-cache
      TILE_CACHE_MAX_MB: ${TILE_CACHE_MAX_MB:-1024}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
    ports:
      - "8420:8420"
    volumes:
      - mapserver_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8420/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mapserver_pgdata:
  mapserver_data:
