services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mapserver-db
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map
      POSTGRES_DB: mapserver
    ports:
      - "5432:5432"
    volumes:
      - mapserver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d mapserver"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mapserver_pgdata:
